<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Pink to Purple Gradient (Back Card & Inner Circle Fill) -->
    <linearGradient id="pink-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Cyan to Blue Gradient (Front Card & Inner Circle Stroke) -->
    <linearGradient id="cyan-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Card Face Gradient (Universal Dark/Light Separation) -->
    <linearGradient id="card-face" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B4C66" />
      <stop offset="100%" stop-color="#222F43" />
    </linearGradient>
  </defs>

  <!-- Back Card (Rotated Clockwise, Pink/Purple Gradient Outline) -->
  <rect x="111" y="46" width="290" height="420" rx="28" fill="url(#card-face)" stroke="url(#pink-purple)" stroke-width="14" transform="rotate(10 256 256)" opacity="0.85" />

  <!-- Front Card (Rotated Counter-Clockwise, Dark Fill, Cyan/Blue Gradient Outline) -->
  <rect x="111" y="46" width="290" height="420" rx="28" fill="url(#card-face)" stroke="url(#cyan-blue)" stroke-width="16" transform="rotate(-5 256 256)" />

  <!-- Center Index Badge Circle -->
  <circle cx="256" cy="296" r="92" fill="#0F172A" stroke="url(#cyan-blue)" stroke-width="14" />

  <circle cx="256" cy="296" r="40" fill="url(#pink-purple)" />
</svg>
