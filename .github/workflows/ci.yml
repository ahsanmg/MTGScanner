# CI: Build & test on Ubuntu and Windows using Qt + CMake
# - installs Qt with jurplel/install-qt-action
# - configures with CMake (Ninja)
# - [TODO] builds and runs ctest
# - [TODO] uploads the build directory as an artifact
name: CI

on:
  push:
    branches: [ master, add-devops ]
  pull_request:
    branches: [ main, add-devops ]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            host: linux
            arch: gcc_64
            qt: '6.8.*'
          - os: windows-latest
            host: windows
            arch: win64_msvc2022_64
            qt: '6.8.*'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        id: install-qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          target: 'desktop'
          host: ${{ matrix.host }}
          arch: ${{ matrix.arch }}
          modules: 'qtmultimedia'
          cache: true

      - name: Show Qt info
        run: |
          echo "Qt installed at: ${{ steps.install-qt.outputs.qt }}"
          ${{ runner.os == 'Windows' && 'where qtpaths || true' || 'which qtpaths || true' }}

      - name: Setup vcpkg caching
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '')

      - name: Configure (CMake)
        env:
          VCPKG_BINARY_SOURCES: 'clear;x-gha,errors'
        run: |
          python --version || true
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_ENV_PASSTHROUGH_UNTRACKED=ON

      - name: Build
        run: |
          cmake --build build --config Release -- -j

      # - name: Run tests (ctest)
      #   run: |
      #     cmake --build build --target test --config Release || true
      #     ctest --test-dir build -C Release --output-on-failure

      # - name: Upload build artifact
      #   if: always()
