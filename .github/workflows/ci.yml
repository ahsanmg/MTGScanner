# CI: Build & test on Ubuntu and Windows using Qt + CMake
# - installs Qt with jurplel/install-qt-action
# - configures with CMake (Ninja)
# - [TODO] builds and runs ctest
# - [TODO] uploads the build directory as an artifact
name: CI

on:
  push:
    branches: [ master, add-devops ]
  pull_request:
    branches: [ master, add-devops ]

jobs:
  build:
    timeout-minutes: 120
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            host: linux
            arch: linux_gcc_64
            qt: '6.8.*'
            triplet: x64-linux-release
          - os: windows-latest
            host: windows
            arch: win64_msvc2022_64
            qt: '6.8.*'
            triplet: x64-windows-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Install Qt
        id: install-qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          target: 'desktop'
          host: ${{ matrix.host }}
          arch: ${{ matrix.arch }}
          modules: 'qtmultimedia'
          cache: true

      # - name: Show Qt info
      #   run: |
      #     echo "Qt installed at: ${{ steps.install-qt.outputs.qt }}"
      #     ${{ runner.os == 'Windows' && 'where qtpaths || true' || 'which qtpaths || true' }}

      - name: Configure (CMake)
        env:
          VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite"
        run: |
          python --version || true
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}" \
            -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_INSTALLATION_ROOT }}/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DVCPKG_OVERLAY_TRIPLETS="${{ github.workspace }}/triplets"

      - name: Build
        run: |
          cmake --build build --config Release

      # - name: Run tests (ctest)
      #   run: |
      #     cmake --build build --target test --config Release || true
      #     ctest --test-dir build -C Release --output-on-failure

      # - name: Upload build artifact
      #   if: always()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: build-${{ matrix.os }}
      #     path: build